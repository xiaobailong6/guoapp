name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - '.github/workflows/**'
      - 'analysis_options.yaml'
      - 'android/**'
      - 'assets/**'
      - 'integration_test/**'
      - 'ios/**'
      - 'lib/**'
      - 'native/**'
      - 'packages/**'
      - 'pubspec.lock'
      - 'pubspec.yaml'
      - 'scripts/**'
      - 'test/**'
      - 'test_driver/**'
      - 'windows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'analysis_options.yaml'
      - 'android/**'
      - 'assets/**'
      - 'integration_test/**'
      - 'ios/**'
      - 'lib/**'
      - 'native/**'
      - 'packages/**'
      - 'pubspec.lock'
      - 'pubspec.yaml'
      - 'scripts/**'
      - 'test/**'
      - 'test_driver/**'
      - 'windows/**'
  workflow_dispatch:
    inputs:
      android:
        description: '构建 Android APK'
        type: boolean
        default: true
      windows:
        description: '构建 Windows ZIP'
        type: boolean
        default: true
      ios:
        description: '构建 iOS 未签名包（macOS runner，私有仓库按 10 倍计费）'
        type: boolean
        default: false
      editions:
        description: '构建哪些版本：zhenguojian 为全站源真果鉴，hongguojian 为红果鉴，both 为两版'
        type: choice
        options:
          - zhenguojian
          - hongguojian
          - both
        default: zhenguojian
      abi:
        description: 'Android 架构：all 为三种架构各出一个 APK'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all
        default: arm64-v8a
      checks:
        description: '构建前先跑静态检查和自动化测试'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  NDK_VERSION: '28.2.13676358'

jobs:
  checks:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.checks }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: dart analyze lib test integration_test test_driver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - run: go test -race ./...
        working-directory: native
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native

  android:
    needs: [checks]
    if: ${{ !cancelled() && needs.checks.result != 'failure' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.android)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - name: Select edition
        id: select
        shell: bash
        env:
          REQUESTED_EDITION: ${{ inputs.editions }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_EDITION:-both}"
          if [ "$requested" = 'both' ] || [ "$requested" = '${{ matrix.edition }}' ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.select.outputs.build == 'true'
      - uses: actions/setup-python@v5
        if: steps.select.outputs.build == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: steps.select.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        if: steps.select.outputs.build == 'true'
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        if: steps.select.outputs.build == 'true'
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Cache Gradle
        if: steps.select.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Install Android NDK
        if: steps.select.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager || true)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo '未找到 sdkmanager，无法安装 NDK。' >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          ndk_home="$sdk_root/ndk/$NDK_VERSION"
          test -d "$ndk_home/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          echo "NDK $NDK_VERSION 已就绪：$ndk_home"
      - name: Configure Android signing
        if: steps.select.outputs.build == 'true'
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build ${{ matrix.edition }} APK
        if: steps.select.outputs.build == 'true'
        shell: bash
        env:
          REQUESTED_ABI: ${{ inputs.abi }}
        run: |
          set -euo pipefail
          abi="${REQUESTED_ABI:-arm64-v8a}"
          case "$abi" in
            all) abi_arguments='--abi arm64-v8a --abi armeabi-v7a --abi x86_64' ;;
            *) abi_arguments="--abi $abi" ;;
          esac
          python scripts/build_android.py ${{ matrix.arguments }} $abi_arguments
      - name: Remove signing files
        if: always() && steps.select.outputs.build == 'true'
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.build == 'true'
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: [checks]
    if: ${{ !cancelled() && needs.checks.result != 'failure' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.windows)) }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - name: Select edition
        id: select
        shell: bash
        env:
          REQUESTED_EDITION: ${{ inputs.editions }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_EDITION:-both}"
          if [ "$requested" = 'both' ] || [ "$requested" = '${{ matrix.edition }}' ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.select.outputs.build == 'true'
      - uses: actions/setup-go@v5
        if: steps.select.outputs.build == 'true'
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        if: steps.select.outputs.build == 'true'
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        if: steps.select.outputs.build == 'true'
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: egor-tensin/setup-mingw@v2
        if: steps.select.outputs.build == 'true'
        with:
          platform: x64
      - name: Build ${{ matrix.edition }} Windows package
        if: steps.select.outputs.build == 'true'
        run: python scripts/build_windows.py ${{ matrix.arguments }}
      - name: Install FFmpeg
        if: steps.select.outputs.build == 'true'
        run: choco install ffmpeg --no-progress -y
      - name: Check packaged app
        if: steps.select.outputs.build == 'true'
        run: python scripts/smoke_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.build == 'true'
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: [checks]
    if: ${{ !cancelled() && needs.checks.result != 'failure' && github.event_name == 'workflow_dispatch' && inputs.ios }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - name: Select edition
        id: select
        shell: bash
        env:
          REQUESTED_EDITION: ${{ inputs.editions }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_EDITION:-both}"
          if [ "$requested" = 'both' ] || [ "$requested" = '${{ matrix.edition }}' ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.select.outputs.build == 'true'
      - uses: actions/setup-python@v5
        if: steps.select.outputs.build == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        if: steps.select.outputs.build == 'true'
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        if: steps.select.outputs.build == 'true'
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Build ${{ matrix.edition }} iOS package
        if: steps.select.outputs.build == 'true'
        run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.build == 'true'
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
