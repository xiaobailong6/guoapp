name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      strict_tests:
        description: Fail the checks job when tests fail
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --language-version 3.12 --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: dart analyze lib test integration_test test_driver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: ${{ github.event.inputs.strict_tests != 'true' }}
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: ${{ github.event.inputs.strict_tests != 'true' }}
      - run: go test -race ./...
        working-directory: native
        continue-on-error: ${{ github.event.inputs.strict_tests != 'true' }}
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: ${{ github.event.inputs.strict_tests != 'true' }}

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: lvguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Android NDK
        run: |
          # GitHub 托管运行器预装 Android SDK，但新版镜像不再把 sdkmanager
          # 加入 PATH，SDK 目录也不固定。先定位 SDK 目录并补装 cmdline-tools，
          # 再安装项目所需 NDK 版本。
          for sdk in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "/usr/local/lib/android/sdk" "$HOME/Android/Sdk"; do
            if [ -n "$sdk" ] && [ -d "$sdk" ]; then
              echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
              echo "ANDROID_NDK_HOME=$sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
              echo "using Android SDK at $sdk"
              SDK_DIR="$sdk"
              break
            fi
          done
          : "${SDK_DIR:?无法定位 Android SDK 目录}"
          # 优先使用已安装的 sdkmanager（可能位于 latest 或版本化目录）。
          SDKMGR=$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n1)
          if [ -z "$SDKMGR" ]; then
            echo "未找到 sdkmanager，正在安装 cmdline-tools..."
            CMDLINE_DIR="$SDK_DIR/cmdline-tools"
            mkdir -p "$CMDLINE_DIR"
            # 下载指定版本的 Android 命令行工具（Linux 版）。
            curl -sSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q -o /tmp/cmdline-tools.zip -d "$CMDLINE_DIR"
            mkdir -p "$CMDLINE_DIR/latest"
            mv -f "$CMDLINE_DIR/cmdline-tools/"* "$CMDLINE_DIR/latest/" 2>/dev/null || true
            rmdir "$CMDLINE_DIR/cmdline-tools" 2>/dev/null || true
            SDKMGR="$CMDLINE_DIR/latest/bin/sdkmanager"
          fi
          SDKMGR_DIR=$(dirname "$SDKMGR")
          echo "$SDKMGR_DIR" >> "$GITHUB_PATH"
          export PATH="$SDKMGR_DIR:$PATH"
          # 关闭 pipefail，避免 `yes |` 因 SIGPIPE 被误判为失败。
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "ndk;28.2.13676358"
          status=$?
          set -o pipefail
          exit $status
      - name: Configure Android signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: lvguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - run: choco install ffmpeg --no-progress -y
      - run: python scripts/smoke_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: lvguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
